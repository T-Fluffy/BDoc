name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Backend unit tests
        run: dotnet test backend/BDoc.Tests/BDoc.Tests.csproj --nologo -v q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start stack
        env:
          # Ephemeral signing key per CI run (backend fails fast without one).
          JWT_KEY: ${{ github.sha }}-${{ github.run_id }}-ci-secret-32chars-minimum-ok
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            # 401 = backend is up with strict auth enforced (anonymous /api/documents is rejected).
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/documents || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "backend is up (HTTP $code)"; exit 0
            fi
            sleep 10
          done
          echo "backend never came up"; docker compose logs backend; exit 1

      - name: Run E2E suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100 backend frontend db
